{% for doador in doadores %}<button type="button" disabled role="option" aria-selected="false" id="doador-opcao-{{ doador.pk }}" data-donor-id="{{ doador.pk }}" data-donor-name="{{ doador.nome }}">{{ doador.nome }}{% if doador.cidade %}<small>{{ doador.cidade }} / {{ doador.uf }}</small>{% endif %}</button>{% empty %}<p class="muted small">Nenhum doador encontrado.</p>{% endfor %}
