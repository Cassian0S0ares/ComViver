{% if paginator.num_pages > 1 %}<div class="table-footer"><span>{{ page_obj.start_index }}–{{ page_obj.end_index }} de {{ paginator.count }}</span><nav class="pagination-nav" aria-label="Paginação">{% if page_obj.has_previous %}<a class="icon-button" href="?{{ filtros_query }}&amp;page={{ page_obj.previous_page_number }}" aria-label="Página anterior"><i class="bi bi-chevron-left" aria-hidden="true"></i></a>{% endif %}<span aria-current="page">Página {{ page_obj.number }} de {{ paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="icon-button" href="?{{ filtros_query }}&amp;page={{ page_obj.next_page_number }}" aria-label="Próxima página"><i class="bi bi-chevron-right" aria-hidden="true"></i></a>{% endif %}</nav></div>{% endif %}
