<div id="turno-{{ turno.pk }}" class="turno-cell {% if turno.esta_descoberto %}is-descoberto{% endif %}"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  <button type="button" class="turno-cell-abrir" data-turno-detalhe="{% url 'escalas:turno_detalhe' turno.pk %}" aria-haspopup="dialog" aria-label="Ver detalhes de {{ turno.atividade.nome }}, {{ turno.hora_inicio|time:'H:i' }} às {{ turno.hora_fim|time:'H:i' }}">
    <span class="turno-cell-atividade">{{ turno.atividade.nome }}</span>
  </button>

  {% for alocacao in turno.alocacoes.all %}<div class="turno-cell-pessoa">{{ alocacao.nome_responsavel }}</div>{% endfor %}
</div>
