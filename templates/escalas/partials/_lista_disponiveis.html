<div class="turno-modal-escolha" role="group" aria-labelledby="turno-escolha-titulo">
  <div class="turno-modal-bloco-cabecalho">
    <strong id="turno-escolha-titulo">Quem está livre neste horário</strong>
    <button type="button" class="icon-button" hx-get="{% url 'escalas:turno_detalhe' turno.pk %}" hx-target="#turno-detalhe-conteudo" aria-label="Fechar lista de pessoas"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
  </div>
  <div class="turno-modal-escolha-lista">
    {% for usuario in usuarios %}
    <button type="button" class="disponiveis-item" hx-post="{% url 'escalas:alocar' turno.pk %}" hx-vals='{"usuario": "{{ usuario.pk }}"}' hx-target="#turno-detalhe-conteudo">
      <span class="disponiveis-item-nome">{{ usuario.get_full_name|default:usuario.username }}</span>
      <span class="disponiveis-item-info muted small">Equipe · {{ usuario.get_perfil_display }}</span>
    </button>
    {% endfor %}
    {% for voluntario in voluntarios %}
    <button type="button" class="disponiveis-item" hx-post="{% url 'escalas:alocar' turno.pk %}" hx-vals='{"voluntario": "{{ voluntario.pk }}"}' hx-target="#turno-detalhe-conteudo">
      <span class="disponiveis-item-nome">{{ voluntario.nome }}</span>
      <span class="disponiveis-item-info muted small">Voluntário · {{ voluntario.resumo_disponibilidade }}</span>
    </button>
    {% endfor %}
    {% if not usuarios and not voluntarios %}
    <p class="muted small disponiveis-vazio">Ninguém livre neste dia e horário. Verifique a disponibilidade declarada nos cadastros.</p>
    {% endif %}
  </div>
</div>
