<div class="surface disponiveis-card">
  <div class="disponiveis-card-header">
    <strong>{{ turno }}</strong>
    <p class="muted small">Voluntários disponíveis neste dia e turno</p>
  </div>
  <div class="disponiveis-lista">
    {% for voluntario in voluntarios %}
      <button type="button" class="disponiveis-item"
              hx-post="{% url 'escalas:alocar' turno.pk %}"
              hx-vals='{"voluntario": "{{ voluntario.pk }}"}'
              hx-target="#turno-{{ turno.pk }}"
              hx-swap="outerHTML"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        <span class="disponiveis-item-nome">{{ voluntario.nome }}</span>
        <span class="disponiveis-item-info muted small">{{ voluntario.resumo_disponibilidade }}</span>
      </button>
    {% empty %}
      <p class="muted small disponiveis-vazio">
        Nenhum voluntário disponível para este dia e turno.
        Verifique a disponibilidade declarada nos cadastros.
      </p>
    {% endfor %}
  </div>
</div>
